<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Live Premier - TikTok Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; overflow: hidden; }
        
        #video-container { position: fixed; inset: 0; z-index: -1; background: #0a0a0a; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* Modern Glass Chat */
        #chat-stream {
            height: 350px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            mask-image: linear-gradient(to top, black 85%, transparent 100%);
            scrollbar-width: none;
            padding-bottom: 20px;
        }
        #chat-stream::-webkit-scrollbar { display: none; }

        .comment {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(15px);
            padding: 8px 12px;
            border-radius: 15px;
            margin-bottom: 8px;
            animation: slideUp 0.3s ease;
            max-width: 90%;
            border: 0.5px solid rgba(255,255,255,0.1);
        }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* PREMIER CSS HEARTS (Sio Emoji) */
        .classic-heart {
            position: absolute; bottom: 100px; right: 30px;
            width: 24px; height: 24px;
            background-color: #ff0050;
            transform: rotate(-45deg);
            pointer-events: none;
            animation: heartFly 3s ease-out forwards;
            box-shadow: 0 0 10px #ff0050;
        }
        .classic-heart::before, .classic-heart::after {
            content: ""; position: absolute; width: 24px; height: 24px;
            background-color: #ff0050; border-radius: 50%;
        }
        .classic-heart::before { top: -12px; left: 0; }
        .classic-heart::after { left: 12px; top: 0; }

        @keyframes heartFly {
            0% { transform: translateY(0) rotate(-45deg) scale(0.5); opacity: 1; }
            100% { transform: translateY(-600px) rotate(-45deg) scale(1.8) translateX(-100px); opacity: 0; }
        }

        .viewer-pill { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); border-radius: 20px; padding: 4px 12px; font-weight: bold; font-size: 13px; }
        .active-dot { width: 8px; height: 8px; background: #ff0050; border-radius: 50%; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <!-- 1. SETUP SCREEN (KABLA YA LIVE) -->
    <div id="setup" class="fixed inset-0 z-50 bg-zinc-950 flex flex-col items-center justify-center p-6 text-center overflow-y-auto">
        <h1 class="text-2xl font-black mb-6 tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-yellow-500">LIVE STREAM CONFIG</h1>
        
        <div class="w-full max-w-sm space-y-4">
            <!-- Profile Pic Upload -->
            <div class="flex flex-col items-center gap-2">
                <div class="w-20 h-20 rounded-full border-2 border-pink-600 overflow-hidden bg-zinc-800 flex items-center justify-center relative">
                    <img id="pfp-preview" src="" class="hidden w-full h-full object-cover">
                    <i class="fa-solid fa-camera text-gray-500" id="camera-icon"></i>
                    <input type="file" id="pfp-input" class="absolute inset-0 opacity-0 cursor-pointer" accept="image/*">
                </div>
                <span class="text-xs text-gray-400">Picha ya Profile</span>
            </div>

            <input type="text" id="username-in" placeholder="Jina la akaunti..." class="w-full bg-zinc-900 border border-zinc-800 p-4 rounded-2xl focus:border-pink-600 outline-none">
            
            <div class="flex gap-2">
                <input type="number" id="target-in" placeholder="Idadi ya watu (mf: 50000)" class="flex-grow bg-zinc-900 border border-zinc-800 p-4 rounded-2xl outline-none">
                <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl flex items-center gap-2">
                    <span class="text-xs">Verified?</span>
                    <input type="checkbox" id="verified-in" class="accent-blue-500 w-5 h-5">
                </div>
            </div>

            <select id="live-mode" class="w-full bg-zinc-900 border border-zinc-800 p-4 rounded-2xl outline-none">
                <option value="Famous">Mtu Maarufu (Celebrity)</option>
                <option value="Doctor">Daktari (Ushauri wa Afya)</option>
                <option value="Relationship">Mahusiano & Love</option>
                <option value="Politics">Siasa & Maisha</option>
                <option value="Comedy">Vichekesho/Comedy</option>
            </select>

            <button onclick="goLiveNow()" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 p-5 rounded-full font-black text-lg shadow-2xl hover:scale-105 transition-transform">GO LIVE 🔴</button>
        </div>
    </div>

    <!-- 2. LIVE UI -->
    <div id="live-ui" class="hidden h-screen flex flex-col justify-between relative">
        <!-- Top Bar -->
        <div class="p-4 flex justify-between items-start pt-8">
            <div class="flex items-center gap-2">
                <div class="p-0.5 rounded-full bg-gradient-to-tr from-pink-500 to-yellow-500 shadow-lg">
                    <img id="host-pfp" src="" class="w-10 h-10 rounded-full border-2 border-black object-cover bg-zinc-800">
                </div>
                <div class="flex flex-col">
                    <span class="font-bold text-sm flex items-center" id="host-name">Username <i id="v-check" class="fa-solid fa-circle-check text-blue-400 ml-1 hidden"></i></span>
                    <span class="text-[10px] text-gray-300 font-medium" id="mode-display">Celebrity</span>
                </div>
                <button class="bg-pink-600 px-3 py-1 rounded-md text-[10px] font-bold ml-1">FOLLOW</button>
            </div>

            <div class="flex items-center gap-2">
                <div class="viewer-pill flex items-center gap-2">
                    <div class="active-dot"></div>
                    <span id="v-number">0</span>
                </div>
                <button class="text-2xl ml-2 drop-shadow-lg">✕</button>
            </div>
        </div>

        <!-- Heart Animation Space -->
        <div id="heart-container" class="flex-grow relative pointer-events-none"></div>

        <!-- Chat Section -->
        <div class="p-4 bg-gradient-to-t from-black/95 via-black/40 to-transparent">
            <div id="chat-stream">
                <!-- Comments zitaingia hapa -->
            </div>

            <div class="flex items-center gap-3 mt-4 pb-4">
                <div class="flex-grow bg-white/10 backdrop-blur-2xl border border-white/20 rounded-full px-5 py-3 text-sm text-gray-300">
                    Sema kitu...
                </div>
                <div class="flex gap-4 text-2xl drop-shadow-xl">
                    <button onclick="userTapTap()"><i class="fa-solid fa-heart text-pink-500"></i></button>
                    <button><i class="fa-solid fa-gift text-yellow-400"></i></button>
                    <button><i class="fa-solid fa-share text-blue-400"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="video-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <script>
        const GROQ_KEY = "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";
        let targetCount = 0;
        let currentViewers = 0;
        let profiles = [];

        // 1. Maandalizi ya Picha ya Profile
        document.getElementById('pfp-input').onchange = function(e) {
            const reader = new FileReader();
            reader.onload = function() {
                document.getElementById('pfp-preview').src = reader.result;
                document.getElementById('pfp-preview').classList.remove('hidden');
                document.getElementById('camera-icon').classList.add('hidden');
                document.getElementById('host-pfp').src = reader.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        };

        // 2. Anza Live
        async function goLiveNow() {
            const user = document.getElementById('username-in').value || "Bongo Star";
            targetCount = parseInt(document.getElementById('target-in').value) || 1200;
            
            document.getElementById('host-name').innerHTML = user + ' <i id="v-check" class="fa-solid fa-circle-check text-blue-400 ml-1 hidden"></i>';
            if(document.getElementById('verified-in').checked) document.getElementById('v-check').classList.remove('hidden');
            document.getElementById('mode-display').innerText = document.getElementById('live-mode').value;
            
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('live-ui').classList.remove('hidden');

            prepareProfiles();
            startCamera();
            startViewerCounter();
            startSpeechEngine();
            autoTapTap();
            
            // Komenti za haraka za kuanzia (Instant Charts)
            initialInstantComments();
        }

        function prepareProfiles() {
            for(let i=0; i<50; i++) {
                profiles.push({
                    name: "User_" + Math.floor(Math.random()*9999),
                    img: `https://i.pravatar.cc/150?u=${Math.random()}`,
                    isWhite: Math.random() > 0.7
                });
            }
        }

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('webcam').srcObject = stream;
        }

        // 3. Number Formatting (K/M)
        function formatViewers(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num;
        }

        function startViewerCounter() {
            setInterval(() => {
                if (currentViewers < targetCount) {
                    currentViewers += Math.floor(targetCount / 30);
                } else {
                    currentViewers += (Math.random() > 0.5 ? 25 : -25);
                }
                document.getElementById('v-number').innerText = formatViewers(currentViewers);
            }, 1000);
        }

        // 4. AI Engine - Inasikiliza na Kujibu
        function startSpeechEngine() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechRec) return;
            const rec = new SpeechRec();
            rec.continuous = true;
            rec.lang = 'sw-TZ';
            rec.onresult = (e) => fetchAIReaction(e.results[e.results.length - 1][0].transcript);
            rec.start();
        }

        async function fetchAIReaction(text) {
            const mode = document.getElementById('live-mode').value;
            const prompt = `Host is a ${mode} and said: "${text}". Generate 4 real viewer comments. Mix English and Bongo Swahili Slang. Format: Name: Comment`;
            try {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${GROQ_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: "llama3-8b-8192", messages: [{role: "user", content: prompt}]})
                });
                const data = await res.json();
                data.choices[0].message.content.split('\n').forEach(c => {
                    if(c.includes(':')) postComment(c.split(':')[0], c.split(':')[1]);
                });
            } catch(e) {}
        }

        function postComment(name, msg) {
            const stream = document.getElementById('chat-stream');
            const p = profiles[Math.floor(Math.random()*profiles.length)];
            const div = document.createElement('div');
            div.className = "comment flex items-start gap-2";
            div.innerHTML = `
                <img src="${p.img}" class="w-8 h-8 rounded-full border border-white/10">
                <div class="flex flex-col">
                    <span class="text-[10px] font-bold text-pink-400">${name.trim().replace(/^\d+\.\s*/, "")}</span>
                    <span class="text-sm text-white font-medium">${msg.trim()}</span>
                </div>
            `;
            stream.appendChild(div);
            stream.scrollTop = stream.scrollHeight;
        }

        // 5. Instant Charts (Zinaanza kabla hujaongea)
        function initialInstantComments() {
            const vibes = ["Mambo vipi guys!", "Hi from Kenya! 🇰🇪", "Oyaa mwanangu safi?", "Umetisha sana!", "Love you host! ❤️", "First time hapa", "Noma sanaaa 🔥", "Can you hear me?", "Bongo to the world"];
            let i = 0;
            const starter = setInterval(() => {
                postComment(profiles[i].name, vibes[Math.floor(Math.random()*vibes.length)]);
                i++;
                if(i >= 10) clearInterval(starter);
            }, 800);
        }

        // 6. Classic Premier Hearts (CSS Based)
        function spawnClassicHeart() {
            const container = document.getElementById('heart-container');
            const h = document.createElement('div');
            h.className = "classic-heart";
            h.style.right = (Math.random() * 80 + 20) + "px";
            h.style.backgroundColor = ["#ff0050", "#fffc00", "#00f2ea", "#ff00d4"][Math.floor(Math.random()*4)];
            container.appendChild(h);
            setTimeout(() => h.remove(), 3000);
        }

        function userTapTap() { for(let i=0; i<8; i++) setTimeout(spawnClassicHeart, i*100); }

        function autoTapTap() {
            setInterval(() => { if(currentViewers > 10) spawnClassicHeart(); }, 400);
        }

    </script>
</body>
</html>
